name: Build Bun Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun build --compile --target=bun-windows-x64 ./pong84-host.js --outfile pong84-host-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pong84-host-windows
          path: pong84-host-windows.exe
